<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Hexagon -->
  <polygon points="100,14 176,58 176,142 100,186 24,142 24,58" 
           fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="2" />

  <!-- Shield Body -->
  <path d="M 100 25 
           C 145 25 165 45 165 95 
           C 165 140 100 175 100 175 
           C 100 175 35 140 35 95 
           C 35 45 55 25 100 25 Z" 
        fill="url(#shieldFill)" stroke="url(#cyanGradient)" stroke-width="3" filter="url(#glow)" />

  <!-- Radar Rings -->
  <circle cx="100" cy="95" r="45" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" stroke-dasharray="4 3" />
  <circle cx="100" cy="95" r="28" fill="none" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" />
  <circle cx="100" cy="95" r="10" fill="#00F2FE" opacity="0.8" />

  <!-- Radar Sweep Line -->
  <line x1="100" y1="95" x2="135" y2="60" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" />

  <!-- Crosshairs -->
  <line x1="100" y1="45" x2="100" y2="145" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1" />
  <line x1="50" y1="95" x2="150" y2="95" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1" />

  <!-- Accent Corner Nodes -->
  <circle cx="100" cy="25" r="3.5" fill="#00F2FE" />
  <circle cx="165" cy="95" r="3.5" fill="#8B5CF6" />
  <circle cx="35" cy="95" r="3.5" fill="#8B5CF6" />
  <circle cx="100" cy="175" r="3.5" fill="#00F2FE" />
</svg>
